<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sha Mo · 学术血缘</title>
  <meta name="description" content="Sha Mo 学术血缘完整 DAG：递归展开全部已收录导师分支，从现代数据库研究追溯至欧洲、拜占庭及伊斯兰中世纪学术传统。">
  <style>
    :root {
      color-scheme: light;
      --ink: #223b3a;
      --muted: #71807a;
      --paper: #f6f5f0;
      --card: #fffefa;
      --cyan: #728f88;
      --line: #e5e8df;
      --accent: #466c62;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scrollbar-color: #b8c5bd var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: #dce9df; color: #203c32; }
    a { color: inherit; text-underline-offset: 4px; }
    button { font: inherit; }
    a, button { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 5px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    main { width: 100%; padding: 0 clamp(8px, 1.4vw, 28px); }
    .graph-shell {
      position: relative;
      width: 100%;
      max-width: 2300px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      overflow: auto;
      scrollbar-width: thin;
      background-image: radial-gradient(#bdc9be60 .8px, transparent .8px);
      background-size: 24px 24px;
    }
    #graph { position: relative; min-height: 100vh; }
    #edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .edge { fill: none; stroke: var(--cyan); stroke-width: 2.6; opacity: .9; stroke-linecap: butt; stroke-linejoin: miter; }
    .node {
      position: absolute;
      z-index: 1;
      width: 650px;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid #dde3d8;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 3px 5px #263e321f, 0 12px 30px -18px #263e3224;
      scroll-margin-top: 28px;
    }
    .card-layout { display: block; }
    .node.notable {
      border-color: #b49a59;
      background: #fffdf6;
      box-shadow: 0 0 0 1px #b49a5955, 0 8px 24px -12px #856b3c55;
    }
    .node.notable .identity {
      background: linear-gradient(125deg, #eee3bf, #faf5e5);
      border-bottom-color: #d9c995;
    }
    .node.notable .person { color: #51401e; }
    .node.notable .alias { color: #78633c; }
    .node.notable .portrait, .node.notable .portrait-fallback { border-color: #b49a5980; }
    .identity {
      display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 20px;
      padding: 18px 24px; align-items: start;
      background: linear-gradient(135deg, #f1f4ec, #f8f9f3);
      border-bottom: 1px solid #e1e7da;
    }
    .identity-main { min-width: 0; min-height: 112px; display: flex; flex-direction: column; }
    .identity, .compact .identity { row-gap: 4px; }
    .identity-polity { margin-left: auto; flex: 0 0 40px; display: flex; align-items: flex-end; justify-content: flex-end; height: 24px; transform: translateY(-8px); }
    .identity-polity .polity-mark { width: 40px; height: 34px; flex-basis: 40px; margin-top: 0; }
    .identity-polity .polity-glyph { width: 40px; height: 34px; flex-basis: 40px; font-size: 25px; }
    .identity-polity:has(.schematic-insignia) { flex-basis: 44px; }
    .schematic-insignia { display: flex; flex-direction: column; align-items: center; }
    .schematic-insignia svg { width: 44px; height: 30px; }
    .identity-main .alias { padding-right: 48px; }
    .portrait, .portrait-fallback {
      display: block; width: 88px; height: 112px; margin: 0; align-self: end;
      border-radius: 10px; border: 1px solid #213c3217; background: #e9eee2;
      object-fit: cover; object-position: center top;
    }
    .portrait-fallback { display: grid; place-items: center; color: #81907c; background: linear-gradient(150deg, #eaf0e3, #dde7d4); font: 500 28px/1 Georgia, serif; }
    .person { margin: 0; color: #223e36; font: 500 25px/1.22 Georgia, "Times New Roman", serif; letter-spacing: -.025em; overflow-wrap: anywhere; text-wrap: pretty; }
    .alias { margin-top: 3px; color: #63745c; font-size: 18px; line-height: 1.35; letter-spacing: .025em; overflow-wrap: anywhere; }
    .identity-footer { display: flex; align-items: center; justify-content: flex-start; flex-wrap: nowrap; gap: 10px; margin-top: auto; white-space: nowrap; }
    .graduation-year { color: #526c60; font-size: 16px; font-weight: 650; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .profile-links { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .profile-link { display: inline-flex; align-items: center; justify-content: center; gap: 5px; width: auto; min-height: 36px; flex-shrink: 0; border-radius: 6px; color: #353b36; font-size: 11px; text-decoration: none; white-space: nowrap; }
    .profile-link svg { width: 16px; height: 16px; flex-shrink: 0; fill: currentColor; }
    .scholar-link { color: #4285f4; }
    .profile-link:hover { background: #e2eadc; }
    .facts { padding: 7px 24px 24px; }
    .fact { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid #e9ece3; }
    .fact:last-child { border-bottom: 0; padding-bottom: 0; }
    .fact-label { color: #86927d; font-weight: 500; align-self: center; }
    .label-en { display: block; font-size: 10px; line-height: 1.45; white-space: nowrap; }
    .label-zh { display: block; margin-top: 5px; font-size: 11px; line-height: 1.55; white-space: nowrap; }
    .fact-value { min-width: 0; font-size: 13px; line-height: 1.65; color: #3c5143; overflow-wrap: anywhere; }
    .value-en { display: block; }
    .value-zh { display: block; margin-top: 7px; color: #78816f; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-style: normal; line-height: 1.65; }
    .institution-text > .value-en { font-weight: 550; color: #304a3b; }
    .country-value { display: flex; align-items: flex-start; gap: 8px; }
    .polity-mark { width: 24px; height: 17px; flex: 0 0 24px; margin-top: 3px; border-radius: 2px; object-fit: contain; }
    .polity-glyph { display: inline-grid; place-items: center; flex: 0 0 24px; height: 20px; color: #8b9985; font-size: 14px; font-style: normal; }
    .thesis-text, .work-text { font-family: Georgia, "Songti SC", serif; font-size: 14px; line-height: 1.65; }
    .thesis-text > .value-en { font-style: italic; }
    .compact .identity { grid-template-columns: 72px minmax(0, 1fr); gap: 4px 15px; padding: 16px 20px; }
    .compact .portrait, .compact .portrait-fallback { width: 72px; height: 94px; }
    .compact .identity-main { min-height: 94px; }
    .compact .person { font-size: 23px; }
    .compact .facts { padding: 6px 20px 22px; }
    .compact .fact { grid-template-columns: 120px minmax(0, 1fr); gap: 12px; }
    .mobile-relations { display: none; }
    .back-top {
      position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); z-index: 5;
      display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
      border: 1px solid #d5dfd3; border-radius: 50%; background: #fffefaee; color: var(--accent);
      box-shadow: 0 4px 18px #263e3214; cursor: pointer; backdrop-filter: blur(10px);
    }
    .back-top[hidden] { display: none; }
    .back-top:hover { background: #edf1e8; }
    @media (max-width: 1100px) {
      main { padding: 0; }
      .graph-shell { max-width: none; overscroll-behavior: contain; }
      .profile-link { min-height: 44px; }
    }
    @media (max-width: 600px) {
      .identity, .compact .identity { grid-template-columns: 66px minmax(0, 1fr); gap: 4px 14px; padding: 14px 18px; }
      .portrait, .portrait-fallback, .compact .portrait, .compact .portrait-fallback { width: 66px; height: 86px; }
      .identity-main, .compact .identity-main { min-height: 86px; }
      .person, .compact .person { font-size: 22px; }
      .identity-footer { margin-top: auto; gap: 8px; }
      .facts, .compact .facts { padding: 5px 18px 20px; }
      .fact, .compact .fact { grid-template-columns: 120px minmax(0, 1fr); gap: 12px; }
    }
    /* Reading canvas: native touch scrolling, explicit navigation and zoom. */
    body { overflow: hidden; }
    main { padding: 0; }
    .graph-shell { max-width: none; overscroll-behavior: contain; touch-action: pan-x pan-y pinch-zoom; }
    .graph-shell.is-panning { cursor: grabbing; user-select: none; scroll-behavior: auto; }
    .canvas-tools { position: fixed; z-index: 10; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 3px; padding: 5px; border: 1px solid #d6ded3; border-radius: 15px; background: #fffffff2; box-shadow: 0 6px 24px #203c321a; }
    .canvas-tools button { border: 0; border-radius: 10px; background: transparent; color: #385a4e; min-width: 44px; height: 44px; padding: 0 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .canvas-tools button:hover { background: #edf2e9; }
    .canvas-tools button:disabled { opacity: .35; cursor: default; }
    .canvas-tools output { min-width: 42px; text-align: center; font-size: 12px; color: #697a70; font-variant-numeric: tabular-nums; }
    .back-top { display: none; }
    .mobile-relations { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 20px 16px; border-top: 1px solid #e9ece3; }
    .relation-label { flex: 0 0 100%; color: #819080; font-size: 10px; }
    .relation-link { padding: 7px 10px; border-radius: 7px; background: #edf2e9; font-size: 12px; text-decoration: none; }
    .node:focus { outline: 2px solid #658e7d; outline-offset: 4px; }
    @media (max-width: 600px) {
      .node { border-radius: 14px; }
      .identity, .compact .identity { grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 16px 14px 12px; }
      .portrait, .portrait-fallback, .compact .portrait, .compact .portrait-fallback { width: 52px; height: 70px; align-self: start; border-radius: 7px; }
      .identity-main, .compact .identity-main { min-height: 70px; }
      .person, .compact .person { font-size: 20px; line-height: 1.2; }
      .person[style] { white-space: normal !important; }
      .alias { font-size: 16px; }
      .identity-main .alias { padding-right: 0; }
      .identity-footer { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 0 6px; margin-top: 4px; }
      .graduation-year { grid-column: 1; grid-row: 1; font-size: 15px; }
      .profile-links { grid-column: 1 / -1; grid-row: 2; flex-wrap: wrap; gap: 4px 12px; }
      .profile-link { min-height: 44px; font-size: 11px; }
      .identity-polity, .identity-polity:has(.schematic-insignia) { grid-column: 2; grid-row: 1; transform: none; height: 24px; }
      .identity-polity .polity-mark, .identity-polity .polity-glyph, .schematic-insignia svg { width: 32px; height: 24px; }
      .facts, .compact .facts { padding: 0 14px 14px; }
      .fact, .compact .fact { grid-template-columns: 94px minmax(0, 1fr); gap: 10px; padding: 12px 0; }
      .label-en { font-size: 9px; }
      .label-zh { font-size: 11px; margin-top: 3px; }
      .fact-value, .thesis-text, .work-text { font-size: 13px; line-height: 1.55; }
      .value-zh { font-size: 13px; line-height: 1.55; margin-top: 4px; }
      .mobile-relations { padding: 12px 14px; }
      .relation-link { min-height: 44px; display: inline-flex; align-items: center; }
      .canvas-tools { gap: 0; bottom: max(10px, env(safe-area-inset-bottom)); }
      .canvas-tools button { padding: 0 8px; font-size: 12px; }
    }
    /* Minimal genealogy: portraits are the navigation surface; details are on demand. */
    .node.mini { border-radius: 18px; background: linear-gradient(160deg,#fffefa,#f2f5ef); box-shadow: 0 2px 4px #263e3208, 0 7px 18px -10px #263e3240; padding: 8px 5px; }
    .mini-toggle { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; gap: 4px; color: #526c60; }
    .mini-toggle .portrait, .mini-toggle .portrait-fallback { width: 60px; height: 64px; flex: 0 0 64px; align-self: center; border-radius: 13px; border: 2px solid #fffefa; box-shadow: 0 1px 6px #263e3220; object-fit: cover; object-position: center 25%; }
    .mini-toggle .portrait-fallback { background: #e6ece1; color: #6b8065; font-size: 20px; }
    .mini-name { max-width: 100%; margin-top: 3px; font-size: 13px; line-height: 18px; font-weight: 650; color: #2f4539; white-space: nowrap; }
    .mini-name.long { font-size: 10px; letter-spacing: -.2px; }
    .mini-year { font-size: 11px; line-height: 16px; font-weight: 500; color: #788579; font-variant-numeric: tabular-nums; white-space: nowrap; }
    @media (hover: hover) { .node.mini:hover { border-color: #91a88a; box-shadow: 0 4px 16px #263e3226; } }
    .mini-toggle [hidden] { display: none !important; }
    .node.mini.notable { background: #faf3df; border-color: #b49a59; }
    .mini-toggle:focus-visible { outline: 2px solid #49735d; outline-offset: 3px; border-radius: 8px; }
    .person-detail { width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); overflow: auto; padding: 0; border: 1px solid #cbd8c7; border-radius: 18px; background: var(--card); color: var(--ink); box-shadow: 0 20px 70px #12291e40; overscroll-behavior: contain; }
    .person-detail::backdrop { background: #1a30284d; backdrop-filter: blur(3px); }
    .detail-close { position: sticky; top: 0; z-index: 2; display: block; margin: 8px 8px 8px auto; min-height: 44px; padding: 0 16px; border: 1px solid #d8e1d3; border-radius: 10px; background: #fffefa; color: #3c5c4e; cursor: pointer; }
    @media (max-width: 600px) { .person-detail { margin: auto auto 12px; max-height: calc(100dvh - 24px); } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media print {
      body { background: white; }
      main { padding: 0; }
      .graph-shell { background: none; }
      .node { box-shadow: none; break-inside: avoid; }
      .back-top { display: none; }
    }
    /* Editorial canvas: the genealogy and biography share one paper surface. */
    body { background: #f4f3ed; }
    .reader { display: grid; grid-template-columns: 300px minmax(0, 1fr); max-width: 1500px; height: 100dvh; margin: 0 auto; padding: 0 48px 0 12px; overflow: hidden; background: radial-gradient(ellipse at 85% 15%,#e8ebdf80,transparent 60%); }
    .focus-panel { grid-column: 2; grid-row: 1; position: relative; isolation: isolate; min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding: clamp(40px,8vh,96px) clamp(24px,5vw,80px) 64px; scrollbar-width: thin; scrollbar-color: #bec7b6 transparent; }
    .focus-panel::before { content: attr(data-year); position: absolute; z-index: -1; top: 10px; right: 0; font-family: Georgia,serif; font-size: clamp(100px,16vw,240px); line-height: 1; letter-spacing: -.075em; color: #61745909; pointer-events: none; }
    #focus-card { border: 0; border-radius: 0; overflow: visible; background: transparent; box-shadow: none; max-width: 830px; }
    #focus-card .identity { padding: 0 0 32px; grid-template-columns: 100px minmax(0,1fr); gap: 28px; background: transparent; border-bottom: 1px solid #bfcab455; align-items: center; }
    #focus-card .identity > .portrait, #focus-card .identity > .portrait-fallback { width: 100px; height: 128px; border-radius: 4px 20px 4px 4px; border: 4px solid #fffdf5; box-shadow: 0 6px 18px -10px #34473355; }
    #focus-card .person { white-space: normal !important; overflow-wrap: anywhere; font-family: Georgia,'Times New Roman',serif; font-weight: 400; letter-spacing: -.035em; line-height: 1.1; color: #293e33; font-size: clamp(29px,3.5vw,54px); }
    #focus-card .alias { font-size: 23px; color: #68795f; margin-top: 10px; letter-spacing: .07em; }

    #focus-card .facts { padding: 20px 0 0; }

    #focus-card .label-en { color: #89927e; font-size: 10px; letter-spacing: .035em; }
    #focus-card .label-zh { color: #67775f; font-weight: 400; }
    #focus-card .value-en { color: #35453b; line-height: 1.65; }
    #focus-card .value-zh { color: #7b8474; line-height: 1.6; margin-top: 4px; }
    #focus-card .profile-link { background: transparent; border-color: #bdc7b455; }
    .reader .graph-shell { grid-column: 1; grid-row: 1; height: 100dvh; width: 100%; border: 0; border-radius: 0; background: linear-gradient(90deg,transparent,#e9eddf44,transparent); overflow-x: hidden; overflow-y: auto; scrollbar-width: none; scroll-behavior: smooth; overscroll-behavior: contain; mask-image: linear-gradient(transparent,#000 7%,#000 93%,transparent); }
    .reader .graph-shell::-webkit-scrollbar { display: none; }
    .reader #graph { margin: 0; background: none; }

    .reader { position: relative; isolation: isolate; background: transparent; --glow-x: 74%; --glow-y: 22%; --glow-hue: 105; }
    .reader::before { content: ''; position: absolute; inset: 0; z-index: -2; pointer-events: none; background: radial-gradient(ellipse at var(--glow-x) var(--glow-y), hsl(var(--glow-hue) 45% 77% / .55), transparent 57%), radial-gradient(ellipse at 92% 78%, #d9c9eb88, transparent 55%), radial-gradient(ellipse at 18% 58%, #ebd7a777, transparent 50%), linear-gradient(135deg,#f4f3eb,#f9f4eb 55%,#edf2e9); }

      nodeEls.forEach((el,key)=>{
        el.classList.toggle('is-active',key===id);
        el.querySelector('button').setAttribute('aria-current',key===id?'true':'false');
      });
      // Do not toggle inert on the surface under the pointer: browsers can
      // retain it as the wheel target until the pointer moves. Keep event
      // routing stable, while excluding offscreen links from keyboard order.
      chapters.forEach(chapter=>{
        const selected=chapter.dataset.person===id;
        chapter.setAttribute('aria-hidden',selected?'false':'true');
        chapter.querySelectorAll?.('a,button').forEach(link=>{link.tabIndex=selected?0:-1;});
      });
      drawEdges();
    }
    function jump(id,behavior=reducedMotion.matches?'auto':'smooth'){
      stopAnimation();
      const target=position.get(id),token=transitionToken,start=scrollPosition;
      if(behavior==='auto'||reducedMotion.matches||Math.abs(start-target)<.001){
        placePosition(target);return;
      }
      transitioning=true;
      let began;
      const tick=time=>{
        if(token!==transitionToken)return;
        began??=time;
        const progress=Math.min(1,(time-began)/(behavior==='quick'?280:transitionDuration));
        const eased=progress<.5?4*progress**3:1-(-2*progress+2)**3/2;
        placePosition(start+(target-start)*eased);
        if(progress<1)requestAnimationFrame(tick);
        else {placePosition(target);transitioning=false;}
      };
      requestAnimationFrame(tick);
    }
    function fitSingleLineText(){
      const labels=Array.from(focusCard.querySelectorAll('.chapter-en,.chapter-zh,.person,.alias'));
      // Restore responsive CSS sizes before measuring, so wider windows grow text again.
      labels.forEach(label=>label.style.removeProperty('font-size'));
      labels.forEach(label=>{
        if(!label.clientWidth)return;
        const css=getComputedStyle(label);
        const padding=(parseFloat(css.paddingLeft)||0)+(parseFloat(css.paddingRight)||0);
        const available=label.clientWidth-padding;
        if(available<=0)return;
        let size=parseFloat(css.fontSize);
        for(let attempt=0;attempt<12&&label.scrollWidth>label.clientWidth;attempt++){
          size=Math.max(.1,size*available/(label.scrollWidth-padding)-.1);
          label.style.fontSize=size+'px';
        }
      });
    }
    function layout(){
      const visible=visibleViewport();
      reader.style.width=visible.width+'px';reader.style.height=visible.height+'px';
      reader.style.left=(window.visualViewport?.offsetLeft||0)+'px';
      reader.style.top=(window.visualViewport?.offsetTop||0)+'px';
      reader.style.setProperty('--chapter-height',visible.height+'px');
      padding=Math.max(24,shell.clientHeight/2-62);
      nodeWidth=window.innerWidth<=600?76:100;
      centerX=Math.min(Math.round(shell.clientWidth*.65),shell.clientWidth-nodeWidth/2-4);
      graph.style.width='100%';graph.style.minHeight=(padding*2+(sequence.length-1)*step+124)+'px';
      sequence.forEach((p,i)=>{
        const el=nodeEls.get(p.id);el.style.left=(centerX-nodeWidth/2)+'px';el.style.top=(padding+i*step)+'px';el.style.width=nodeWidth+'px';el.style.height='124px';
      });
      svg.setAttribute('width',shell.clientWidth);svg.setAttribute('height',parseFloat(graph.style.minHeight));
      fitSingleLineText();drawEdges();scenes.forEach(fitScene);jump(activeId,'auto');updateAtmosphere();
    }
    const interactiveTarget=event=>event.target?.closest?.('a,input,textarea,select,[contenteditable="true"]');
    function moveDrag(event){
      if(!drag||drag.id!==event.pointerId)return;
      const dy=drag.y-event.clientY,dx=drag.x-event.clientX;
      if(!drag.moved&&Math.abs(dy)<4)return;
      if(!drag.moved&&Math.abs(dx)>Math.abs(dy))return;
      drag.moved=true;
      placePosition(drag.position+dy/drag.scale);
      event.preventDefault?.();
    }
    function endDrag(event){
      if(!drag||drag.id!==event.pointerId)return;
      moveDrag(event);
      const moved=drag.moved;drag=null;
      if(moved)suppressClickUntil=Date.now()+500;
      settleFocus();
    }
    window.addEventListener('pointermove',moveDrag,{passive:false});
    window.addEventListener('pointerup',endDrag);
    window.addEventListener('pointercancel',()=>{drag=null;settleFocus();});
    window.addEventListener('blur',()=>{drag=null;suppressClickUntil=0;settleFocus();});
    // Capture on the stable window: the content beneath a stationary pointer
    // changes during a chapter transition.
    window.addEventListener('wheel',event=>{
        if(event.ctrlKey||!event.deltaY||Math.abs(event.deltaX||0)>Math.abs(event.deltaY)||event.target?.closest?.('input,textarea,select,[contenteditable="true"]'))return;
        event.preventDefault();
        if(drag)return;
        stopAnimation();
        const onRail=!!event.target?.closest?.('.graph-shell');
        const scale=onRail?step:Math.max(1,panel.clientHeight);
        const unit=event.deltaMode===1?18:event.deltaMode===2?scale:1;
        placePosition(scrollPosition+event.deltaY*unit/scale);
        scheduleSettle();
    },{passive:false,capture:true});
    [shell,panel].forEach(scroller=>{
      scroller.addEventListener('pointerdown',event=>{
        if(event.isPrimary===false){drag=null;settleFocus();return;}
        suppressClickUntil=0;
        if(event.button!==0||interactiveTarget(event))return;
        stopAnimation();
        drag={id:event.pointerId,x:event.clientX,y:event.clientY,position:scrollPosition,
          scale:scroller===shell?step:Math.max(1,panel.clientHeight),moved:false};
      });
      scroller.addEventListener('dragstart',event=>{event.preventDefault();});
      scroller.addEventListener('pointercancel',()=>{drag=null;settleFocus();});
      scroller.addEventListener('click',event=>{
        if(event.detail!==0&&Date.now()<suppressClickUntil){event.preventDefault();event.stopImmediatePropagation();}
        suppressClickUntil=0;
      },true);
    });
    graph.addEventListener('click',event=>{const button=event.target.closest('.mini-toggle');if(button)jump(button.dataset.person,'quick');});
    window.addEventListener('keydown',event=>{
      if(!['ArrowDown','ArrowUp','Home','End'].includes(event.key))return;
      if(event.ctrlKey||event.metaKey||event.altKey)return;
      if(event.target?.closest?.('input,textarea,select,[contenteditable="true"]'))return;
      if(event.repeat){event.preventDefault();return;}
      event.preventDefault();const current=position.get(activeId);
      const index=event.key==='Home'?0:event.key==='End'?sequence.length-1:Math.max(0,Math.min(sequence.length-1,current+(event.key==='ArrowDown'?1:-1)));
      jump(sequence[index].id);
      if(event.target?.closest?.('.mini-toggle'))nodeEls.get(sequence[index].id).querySelector('button').focus({preventScroll:true});
    });
    let resizeTimer;
    window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(layout,120);});
    window.visualViewport?.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(layout,120);});
    window.visualViewport?.addEventListener('scroll',()=>{
      reader.style.left=(window.visualViewport.offsetLeft||0)+'px';reader.style.top=(window.visualViewport.offsetTop||0)+'px';
    });
    focusPerson('sha');layout();document.fonts.ready.then(layout);
  })();
  </script>
</body>
</html>
